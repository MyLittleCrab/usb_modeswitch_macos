name: Build and Release

on:
  push:
    branches:
      - master
  workflow_dispatch: 

jobs:
  build-macos-x64:
    runs-on: macos-13
    steps:
      # 1. Клонируем репозиторий
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Читаем версию
      - name: Read version from file
        id: get_version
        run: |
          VERSION="$(cat modeswitchversion.txt | tr -d '\n\r')-macos"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      # 3. Запускаем ваш скрипт сборки
      - name: Build project
        run: |
          cd build_with_static_linking
          chmod +x ./build_for_current_platform.sh
          ./build_for_x64_on_arm.sh
          chmod +x ./build_for_x64_on_arm.sh

      - name: Verify build artifacts
        run: |
          ls -la
          if [ ! -f "./usb_modeswitch-x64" ] || [ ! -f "./usb_modeswitch-current" ]; then
            echo "ERROR: usb_modeswitch-x64 or usb_modeswitch-current files not found!"
            exit 1
          fi
          mv ./usb_modeswitch-current ./usb_modeswitch-arm64

      # 5. Создаём релиз и загружаем файлы
      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: ${{ steps.get_version.outputs.version }}
          body: "Statically linked binaries with libusb."
          draft: false
          prerelease: false
          files: |
            ./usb_modeswitch-x64
            ./usb_modeswitch-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
